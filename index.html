<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parfait 다운로드</title>
  <meta name="description" content="우리가 쌓을 하루, 사진 공유 캔버스 SNS Parfait (Google Play · App Store)">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Parfait">
  <meta property="og:description" content="우리가 쌓을 하루, 사진 공유 캔버스 SNS">
  <meta property="og:url" content="https://citytexi.github.io/temp-parfait-multi-link-web/">
  <meta property="og:image" content="https://citytexi.github.io/temp-parfait-multi-link-web/icon-512.png">
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    /* Figma "인스타그램 게시물" Page 1(폭 1080)에 비율을 맞춘다. 1u = 디자인 1px */
    :root {
      --u: calc(min(100vw, 480px) / 1080);
      --bg: #000000;
      --glow: rgba(88, 60, 48, 0.55);
      --text: #ffffff;
      --sub: #dce3e6;
      --line: #ffffff;
      --accent: #e3123a;
      --accent-text: #ffffff;
      --surface: rgba(255, 255, 255, 0.08);
      --surface-line: rgba(255, 255, 255, 0.16);
      --mono-filter: none;
      --icon-ring: transparent;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fafafa;
        --glow: rgba(227, 18, 58, 0.10);
        --text: #111111;
        --sub: #4a5256;
        --line: #111111;
        --surface: rgba(0, 0, 0, 0.04);
        --surface-line: rgba(0, 0, 0, 0.10);
        --mono-filter: invert(1);
        --icon-ring: rgba(0, 0, 0, 0.10);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(120% 70% at 100% 100%, var(--glow), transparent 70%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: "Pretendard Variable", Pretendard, -apple-system, "Noto Sans KR", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
    }
    main {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header (5039:2600) */
    .header {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: calc(var(--u) * 32);
      padding: max(calc(var(--u) * 80), env(safe-area-inset-top)) calc(var(--u) * 70) 0;
    }
    .platform {
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 16);
      padding: calc(var(--u) * 20) calc(var(--u) * 28);
      border: max(1px, calc(var(--u) * 2.861)) solid var(--line);
      border-radius: 999px;
      font-size: calc(var(--u) * 40);
      font-weight: 700;
      line-height: 1;
    }
    .platform img {
      width: calc(var(--u) * 8);
      height: calc(var(--u) * 8);
      filter: var(--mono-filter);
    }
    .title-block {
      display: flex;
      flex-direction: column;
      gap: calc(var(--u) * 28);
      width: 100%;
    }
    h1 {
      margin: 0;
      font-size: calc(var(--u) * 92);
      font-weight: 700;
      line-height: 1.2;
    }
    .tagline {
      display: flex;
      align-items: flex-start;
      gap: calc(var(--u) * 16);
      padding-left: calc(var(--u) * 8);
    }
    .tagline p {
      flex: 1;
      margin: 0;
      color: var(--sub);
      font-size: calc(var(--u) * 38);
      font-weight: 500;
      line-height: 1.5;
    }
    .tagline b { font-weight: 700; }
    .app-icon {
      width: calc(var(--u) * 124);
      height: calc(var(--u) * 124);
      border-radius: calc(var(--u) * 20);
      box-shadow: 0 0 0 1px var(--icon-ring);
    }

    /* 다운로드 버튼 */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 24px calc(var(--u) * 70) 0;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 14px 20px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }
    .btn:active { opacity: .85; }
    .hint {
      margin: 2px 0 0;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--surface-line);
      color: var(--sub);
      font-size: 13px;
      line-height: 1.6;
    }
    .hint b { color: var(--text); }

    /* Area (5039:1816): 게시물처럼 화면 아래로 이어지는 캔버스 미리보기 */
    .preview {
      padding: 28px calc(var(--u) * 78) 0;
    }
    .preview img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: calc(var(--u) * 40) calc(var(--u) * 40) 0 0;
      /* 디자인처럼 아래가 잘려 보이도록 끝을 흐리게 처리한다. */
      -webkit-mask-image: linear-gradient(to bottom, #000 75%, transparent);
      mask-image: linear-gradient(to bottom, #000 75%, transparent);
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header class="header">
      <div class="platform">
        <span>iOS</span>
        <img src="assets/dot.svg" alt="" width="8" height="8">
        <span>Android</span>
      </div>
      <div class="title-block">
        <h1>Parfait</h1>
        <div class="tagline">
          <p>우리가 쌓을 하루,<br><b>사진 공유 캔버스 SNS</b></p>
          <img class="app-icon" src="icon-512.png" alt="Parfait 앱 아이콘" width="124" height="124">
        </div>
      </div>
    </header>

    <section class="actions">
      <a id="store" class="btn primary" href="https://play.google.com/store/apps/details?id=com.teamyg.parfait">
        Google Play에서 다운로드
      </a>
      <a id="appstore" class="btn primary" href="https://apps.apple.com/kr/app/%ED%8C%8C%EB%A5%B4%ED%8E%98-parfait-%EC%82%AC%EC%A7%84-%EA%B3%B5%EC%9C%A0-%EC%BA%94%EB%B2%84%EC%8A%A4-sns/id6806914364">
        App Store에서 다운로드
      </a>
      <a id="external" class="btn" href="#" hidden>외부 브라우저로 열기</a>

      <p id="inapp-hint" class="hint" hidden>
        스토어가 열리지 않으면 오른쪽 위 <b>⋮</b> 메뉴에서
        <b>외부 브라우저에서 열기</b>를 눌러주세요.
      </p>
    </section>

    <div class="preview">
      <img src="assets/hero.jpg" alt="Parfait 캔버스 화면 미리보기" width="924" height="842">
    </div>
  </main>

  <script>
    (function () {
      var PACKAGE = "com.teamyg.parfait";
      var WEB_URL = "https://play.google.com/store/apps/details?id=" + PACKAGE;

      var ua = navigator.userAgent || "";
      var isAndroid = /Android/i.test(ua);
      var isKakao = /KAKAOTALK/i.test(ua);
      var isInApp = /Instagram|FBAN|FBAV|FB_IAB|KAKAOTALK|NAVER|Line\/|Threads/i.test(ua);

      // iPadOS는 데스크톱 Safari UA(Macintosh)를 쓰므로 터치 지원 여부로 구분한다.
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

      var store = document.getElementById("store");
      var appstore = document.getElementById("appstore");

      // iOS는 App Store 버튼만 보여준다. 데스크톱은 두 버튼을 모두 둔다.
      if (isIOS) {
        store.hidden = true;
        return;
      }
      if (!isAndroid) return;

      appstore.hidden = true;
      var external = document.getElementById("external");
      var hint = document.getElementById("inapp-hint");

      // Play 스토어 앱을 직접 여는 intent. 스토어 앱이 없으면 Play 웹으로 폴백한다.
      store.href =
        "intent://details?id=" + PACKAGE +
        "#Intent;scheme=market;package=com.android.vending;" +
        "S.browser_fallback_url=" + encodeURIComponent(WEB_URL) + ";end";

      if (!isInApp) {
        // 일반 브라우저: 바로 스토어로 보낸다.
        location.replace(store.href);
        return;
      }

      // 인앱 브라우저: 자동 이동은 막히므로 사용자 탭으로만 이동시킨다.
      // #fragment가 있으면 intent의 #Intent 구분자와 섞이므로 떼어낸다.
      var url = location.href.split("#")[0];
      var here = url.replace(/^https?:\/\//, "");
      external.href = isKakao
        ? "kakaotalk://web/openExternal?url=" + encodeURIComponent(url)
        : "intent://" + here + "#Intent;scheme=https;package=com.android.chrome;" +
          "S.browser_fallback_url=" + encodeURIComponent(url) + ";end";
      external.hidden = false;
      hint.hidden = false;
    })();
  </script>
</body>
</html>
